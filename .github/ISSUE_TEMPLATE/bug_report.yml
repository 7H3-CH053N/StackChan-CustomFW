name: Bug report
description: Something on the robot or the server does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Say the wake word\n2. ..."
  - type: input
    id: commit
    attributes:
      label: Commit of this repo you built from
      placeholder: "e.g. 1dd1eb2"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Firmware, Server, Home Assistant integration, Not sure]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Where did you buy it (M5Stack, Kickstarter, OpenELAB, self-built) and which CoreS3 revision, if you know.
  - type: textarea
    id: log
    attributes:
      label: Serial log or server log
      description: Remove keys, tokens, addresses and names before pasting. For reboots, add the decoded coredump (see CONTRIBUTING.md).
      render: text
